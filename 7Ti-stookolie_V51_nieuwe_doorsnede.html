
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huisbrandoliebrander | Interactieve lesanimatie V46</title>
<!-- ================== 1. OPMAAK / KLEUREN ================== -->
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#e9f3ff;background:#081525}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 30% 0%,#1b3957,#081525 70%)}
header{padding:20px 25px;border-bottom:1px solid #31506c;display:flex;justify-content:space-between;align-items:center}
h1{font-size:23px;margin:0}
small{color:#9ab5ca}
.layout{display:grid;grid-template-columns:minmax(550px,1.7fr) minmax(300px,1fr);gap:16px;padding:18px}
.panel{background:#10243a;border:1px solid #35516b;border-radius:14px;padding:16px;box-shadow:0 8px 26px #0004}
.panel h2{font-size:16px;margin:0 0 13px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid #53708a;background:#233d56;color:white;border-radius:9px;padding:12px 16px;font-weight:700;font-size:14px}
.btn:hover{filter:brightness(1.2)}
.btn:focus-visible{outline:3px solid #fff}
.on{background:#167b63}
.off{background:#a74747}
.amber{background:#9a6b23}
.indicator{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;background:#20374d;margin:5px 5px 5px 0}
.dot{width:11px;height:11px;border-radius:50%;background:#60788d}
.lit .dot{background:#46e9a1;box-shadow:0 0 13px #46e9a1}
.danger .dot{background:#ff6666;box-shadow:0 0 13px #ff6666}
.steps{display:grid;gap:8px}
.step{border-left:4px solid #3b5d78;padding:9px 11px;background:#172d43;border-radius:6px;font-size:14px}
.step.active{border-color:#4bd4ff;background:#24506b}
.step.done{border-color:#42c88f}
.status{font-weight:800;color:#75ddff;font-size:19px;margin:8px 0}
.readout{background:#091c2e;padding:13px;border-radius:9px;margin:12px 0;line-height:1.6}
svg{width:100%;height:auto;display:block}
.flow{stroke-dasharray:6 14;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-40}
}
.fan{transform-origin:200px 247px;animation:spin .55s linear infinite;animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}
}
.flame{transform-origin:670px 246px;animation:flicker .3s ease-in-out infinite alternate}
@keyframes flicker{to{transform:scale(1.04,.89) translateY(8px);opacity:.83}
}
.spark{animation:blink .16s infinite alternate}
@keyframes blink{to{opacity:.15}
}
.hidden{display:none!important}
.caption{font-size:13px;color:#b2cadd;margin-top:8px}
.foot{padding:0 20px 20px;color:#9db7cb;font-size:12px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}
.panel{min-width:0}
}
@media(max-width:600px){.layout{padding:8px}
.panel{padding:10px}
h1{font-size:18px}
}

.schoolbrand{display:flex;align-items:center;gap:14px}
.schoollogo{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:12px;padding:5px;flex-shrink:0}
.schoolbrand #clock{font-weight:800;white-space:nowrap}
@media(max-width:600px){.schoollogo{width:48px;height:48px}
.schoolbrand{gap:7px}
}
